<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forget Me Settings</title>
    <link rel="stylesheet" href="styles/setting.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚙️ Settings</h1>
        <p>Customize your privacy preferences</p>
      </header>
      <section class="card">
        <h2>Automatic Cleanup</h2>
        <div class="setting">
          <div>
            <h3>Enable Auto Cleanup</h3>
            <p>Automatically remove browsing data</p>
          </div>
          <input type="checkbox" id="auto-clean" />
        </div>
        <select id="frequency">
          <option>Every Day</option>
          <option>Every Week</option>
          <option>Every Month</option>
        </select>
      </section>
      <section class="card">
        <h2>Default Cleanup Data</h2>
        <label>
          <input type="checkbox" checked />
          Cookies
        </label>
        <label>
          <input type="checkbox" checked />
          Cache
        </label>
        <label>
          <input type="checkbox" />
          History
        </label>
        <label>
          <input type="checkbox" />
          Local Storage
        </label>
        <label>
          <input type="checkbox" />
          IndexedDB
        </label>
      </section>
      <section class="card">
        <h2>Privacy</h2>
        <div class="setting">
          <span>Show Privacy Score</span>
          <input type="checkbox" checked />
        </div>
        <div class="setting">
          <span>Detect Trackers</span>
          <input type="checkbox" />
        </div>
      </section>
      <button id="save">Save Settings</button>
      <footer>All data stays locally</footer>
    </div>
    <script src="scripts/setting.js"></script>
  </body>
</html>
